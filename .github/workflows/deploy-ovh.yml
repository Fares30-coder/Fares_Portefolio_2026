# Compile le front React et l'envoie par FTP sur l'hébergement OVH à chaque push sur main.
# L'API, elle, reste déployée sur Render.
#
# À configurer une fois dans GitHub : Settings → Secrets and variables → Actions
#   Secrets   : FTP_SERVER (ex. ftp.cluster0XX.hebergement.com), FTP_USERNAME, FTP_PASSWORD
#   Variable  : VITE_API_URL (adresse de l'API Render, sans / final)
name: Déploiement du front sur OVH

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/deploy-ovh.yml'
  workflow_dispatch: # bouton « Run workflow » pour lancer un déploiement à la main

concurrency:
  group: deploy-ovh
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Installer les dépendances du front
        run: npm ci --prefix client

      - name: Compiler le front
        run: npm run build --prefix client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://fares-portefolio-2026.onrender.com' }}

      - name: Envoyer sur OVH par FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: client/dist/
          server-dir: www/ # dossier racine du site sur l'hébergement OVH
